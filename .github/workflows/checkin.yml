name: WorkBuddy Daily Check-in

on:
  schedule:
    # 每天 01:30 北京时间 (UTC+8) 运行 -> UTC 17:30
    # 参考同账号私有免费仓库（贴吧/网易云项目）实测：凌晨时段触发稳定，仅延迟大
    - cron: '30 17 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # 恢复 refresh token 缓存（自动续期用；首次运行无缓存时跳过）
      # 每个账号使用独立的 key 命名空间（wb-rt-a1- / a2- / a3- …），互不干扰。
      # 注意：Actions 缓存 key 一旦写入就不可覆盖，所以 save 必须用「每次运行都不同」的
      # key（run_id+run_attempt），再用 restore-keys 前缀取回最近一次，否则轮换后的
      # 新 refresh token 永远存不进去（历史上一直是这样，缓存停在首次创建时间）。
      - name: Restore refresh token cache (account1)
        id: restore-refresh
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token
          key: wb-rt-a1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a1-

      - name: Restore refresh token cache (account2)
        id: restore-refresh-2
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token_2
          key: wb-rt-a2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a2-

      - name: Restore refresh token cache (account3)
        id: restore-refresh-3
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token_3
          key: wb-rt-a3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a3-

      - name: Restore refresh token cache (account4)
        id: restore-refresh-4
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token_4
          key: wb-rt-a4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a4-

      - name: Restore refresh token cache (account5)
        id: restore-refresh-5
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token_5
          key: wb-rt-a5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a5-

      - name: Restore refresh token cache (account6)
        id: restore-refresh-6
        uses: actions/cache/restore@v4
        with:
          path: .refresh_token_6
          key: wb-rt-a6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-rt-a6-

      - name: Run check-in
        env:
          # 账号1（原有）
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
          WB_USER_ID: ${{ secrets.WB_USER_ID }}
          # 账号2
          WB_ACCESS_TOKEN_2: ${{ secrets.WB_ACCESS_TOKEN_2 }}
          WB_REFRESH_TOKEN_2: ${{ secrets.WB_REFRESH_TOKEN_2 }}
          WB_USER_ID_2: ${{ secrets.WB_USER_ID_2 }}
          # 账号3
          WB_ACCESS_TOKEN_3: ${{ secrets.WB_ACCESS_TOKEN_3 }}
          WB_REFRESH_TOKEN_3: ${{ secrets.WB_REFRESH_TOKEN_3 }}
          WB_USER_ID_3: ${{ secrets.WB_USER_ID_3 }}
          # 账号4（Estrella / 15123972125）
          WB_ACCESS_TOKEN_4: ${{ secrets.WB_ACCESS_TOKEN_4 }}
          WB_REFRESH_TOKEN_4: ${{ secrets.WB_REFRESH_TOKEN_4 }}
          WB_USER_ID_4: ${{ secrets.WB_USER_ID_4 }}
          # 账号5（本机当前登录账号 15803022198）
          WB_ACCESS_TOKEN_5: ${{ secrets.WB_ACCESS_TOKEN_5 }}
          WB_REFRESH_TOKEN_5: ${{ secrets.WB_REFRESH_TOKEN_5 }}
          WB_USER_ID_5: ${{ secrets.WB_USER_ID_5 }}
          # 账号6（本机当前登录账号 17642510704）
          WB_ACCESS_TOKEN_6: ${{ secrets.WB_ACCESS_TOKEN_6 }}
          WB_REFRESH_TOKEN_6: ${{ secrets.WB_REFRESH_TOKEN_6 }}
          WB_USER_ID_6: ${{ secrets.WB_USER_ID_6 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python workbuddy_checkin.py

      # 保存最新的 refresh token（轮换后持久化，供下次运行续期）
      # key 带 run_id/run_attempt，保证每次都能写入新缓存（旧 key 不可覆盖）
      - name: Save refresh token cache (account1)
        if: always()
        continue-on-error: true   # 缓存更新失败不阻断主流程（下次回退到 Secret 值）
        uses: actions/cache/save@v4
        with:
          path: .refresh_token
          key: wb-rt-a1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save refresh token cache (account2)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .refresh_token_2
          key: wb-rt-a2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save refresh token cache (account3)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .refresh_token_3
          key: wb-rt-a3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save refresh token cache (account4)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .refresh_token_4
          key: wb-rt-a4-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save refresh token cache (account5)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .refresh_token_5
          key: wb-rt-a5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save refresh token cache (account6)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .refresh_token_6
          key: wb-rt-a6-${{ github.run_id }}-${{ github.run_attempt }}
