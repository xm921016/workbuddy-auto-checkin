name: probe-uid
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: print uid prefix
        env:
          U1: ${{ secrets.WB_USER_ID }}
          U2: ${{ secrets.WB_USER_ID_2 }}
          U3: ${{ secrets.WB_USER_ID_3 }}
          U4: ${{ secrets.WB_USER_ID_4 }}
          U5: ${{ secrets.WB_USER_ID_5 }}
          T1: ${{ secrets.WB_ACCESS_TOKEN }}
          T2: ${{ secrets.WB_ACCESS_TOKEN_2 }}
          T3: ${{ secrets.WB_ACCESS_TOKEN_3 }}
          T4: ${{ secrets.WB_ACCESS_TOKEN_4 }}
          T5: ${{ secrets.WB_ACCESS_TOKEN_5 }}
        run: |
          python3 - <<'PYEOF'
          import os, base64, json
          def sub(t):
              try:
                  s = t.split('.')[1]
                  s += '=' * (-len(s) % 4)
                  return json.loads(base64.urlsafe_b64decode(s)).get('sub', '?')
              except Exception:
                  return 'err'
          for i in ('1', '2', '3', '4', '5'):
              u = os.environ.get('U' + i, '')
              t = os.environ.get('T' + i, '')
              print("PROBE account%s: env_uid=%s token_sub=%s" % (i, u[:8], sub(t)[:8]))
          PYEOF
